name: Deploy

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run build

            - name: Deploy to VPS
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      set -e
                      cd /opt/pf-logger
                      git pull origin main
                      npm ci --omit=dev
                      npm run db:generate
                      if ! npx prisma migrate deploy 2>migrate.err; then
                        if grep -q P1002 migrate.err; then
                          echo "P1002 advisory lock — applying via db:apply-pending"
                          npm run db:apply-pending
                        else
                          cat migrate.err
                          rm -f migrate.err
                          exit 1
                        fi
                      fi
                      rm -f migrate.err
                      npm run build
                      sudo systemctl restart pf-logger
                      sleep 3
                      curl -fsS http://127.0.0.1:8080/api/health || exit 1
