name: Deploy

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            # prisma generate (postinstall) parses prisma.config.ts which requires DATABASE_URL.
            # No real connection is made during generate — a placeholder is sufficient.
            DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm install --no-audit --no-fund
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run build

            - name: Deploy to VPS
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      set -e
                      git config --global --add safe.directory /opt/pf-logger
                      cd /opt/pf-logger
                      # Deploy target must always mirror main. npm sometimes rewrites
                      # package-lock.json, which makes `git pull` abort — hard reset instead.
                      git fetch origin main
                      git reset --hard origin/main
                      # `npm install` (not `npm ci`): the lockfile is generated on
                      # Windows and omits Linux-only optional deps, which `npm ci`
                      # rejects. Any drift it causes is wiped by the reset above.
                      npm install --no-audit --no-fund
                      npm run db:generate
                      if ! npx prisma migrate deploy 2>migrate.err; then
                        if grep -q P1002 migrate.err; then
                          echo "P1002 advisory lock — applying via db:apply-pending"
                          npm run db:apply-pending
                        else
                          cat migrate.err
                          rm -f migrate.err
                          exit 1
                        fi
                      fi
                      rm -f migrate.err
                      npm run build
                      sudo systemctl restart pf-logger
                      sleep 3
                      curl -fsS http://127.0.0.1:8080/api/health || exit 1
